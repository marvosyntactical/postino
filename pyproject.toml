[project]
name = "pi"
version = "0.1.0"
description = "Posterior inoculation experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
    "vllm",
    "transformers",
    "peft",
    "accelerate",
    "datasets",
    "huggingface-hub[hf-xet]",
    "scikit-learn",
    "pandas",
    "pyyaml",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi"]
